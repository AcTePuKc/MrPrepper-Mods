[Diagnostics]

## Log the tooltip objects and font sizes changed by the fix.
DebugLogging = false

[Tooltip]

## Enable the tooltip-only size and positioning fix.
Enabled = true

## Multiplier for TMP font sizes inside TooltipManagerV2.
Scale = 1.8

## Also scale quantity/category text shown with item tooltips.
ScaleAuxiliaryText = true

## Keep the tooltip outside the mouse pointer when there is room.
SafePositioning = true

## Distance in canvas units between the mouse pointer and the tooltip.
MouseGap = 0

## Minimum distance from the canvas edge.
EdgePadding = 2
