name: Normalize I2 English dump

on:
  workflow_dispatch:
  push:
    branches:
      - translation/bg-qa-fixes
    paths:
      - .github/workflows/normalize-i2-dump.yml
      - scripts/normalize_i2_dump.py
      - temp/translation-dumps/i2-terms-en-only.tsv

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: translation/bg-qa-fixes

      - name: Normalize and split dump
        run: |
          python3 scripts/normalize_i2_dump.py \
            temp/translation-dumps/i2-terms-en-only.tsv \
            temp/translation-dumps/generated \
            --chunk-size 1500

      - name: Show report
        run: cat temp/translation-dumps/generated/report.txt

      - name: Upload normalized dump
        uses: actions/upload-artifact@v4
        with:
          name: i2-english-normalized
          path: temp/translation-dumps/generated/

      - name: Commit generated files
        run: |
          if git diff --quiet -- temp/translation-dumps/generated; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp/translation-dumps/generated
          git commit -m "Generate normalized English I2 dump"
          git push
