name: Normalize I2 translation dumps

on:
  workflow_dispatch:
  push:
    branches:
      - translation/bg-qa-fixes
    paths:
      - .github/workflows/normalize-i2-dump.yml
      - scripts/normalize_i2_dump.py
      - temp/translation-dumps/i2-terms-en-only.tsv
      - temp/translation-dumps/i2-reference-french.txt
      - temp/translation-dumps/i2-reference-russian.txt
      - src/MrPrepperTranslationMod/translations/labels.txt

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: translation/bg-qa-fixes

      - name: Normalize and split dumps
        run: |
          python3 scripts/normalize_i2_dump.py \
            temp/translation-dumps/i2-terms-en-only.tsv \
            temp/translation-dumps/generated \
            --bg src/MrPrepperTranslationMod/translations/labels.txt \
            --fr temp/translation-dumps/i2-reference-french.txt \
            --ru temp/translation-dumps/i2-reference-russian.txt \
            --chunk-size 1500

      - name: Show report
        run: cat temp/translation-dumps/generated/report.txt

      - name: Upload normalized QA dumps
        uses: actions/upload-artifact@v4
        with:
          name: i2-qa-normalized
          path: temp/translation-dumps/generated/

      - name: Commit generated files
        run: |
          git add temp/translation-dumps/generated

          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate normalized translation QA dumps"
          git push

