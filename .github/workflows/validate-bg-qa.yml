name: Validate Bulgarian QA

on:
  push:
    branches:
      - translation/bg-qa-fixes
    paths:
      - 'temp/bg-qa/**'
      - 'temp/translation-dumps/generated/compare/**'
      - 'scripts/validate_bg_qa.py'
      - 'scripts/apply_bg_qa.py'
      - '.github/workflows/validate-bg-qa.yml'
  pull_request:
    paths:
      - 'temp/bg-qa/**'
      - 'temp/translation-dumps/generated/compare/**'
      - 'scripts/validate_bg_qa.py'
      - 'scripts/apply_bg_qa.py'
      - '.github/workflows/validate-bg-qa.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run structural validator
        id: validate
        shell: bash
        run: |
          set +e
          python scripts/validate_bg_qa.py > temp/bg-qa-validation-report.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat temp/bg-qa-validation-report.txt
          exit 0

      - name: Run merge dry-run
        id: merge
        shell: bash
        run: |
          set +e
          python scripts/apply_bg_qa.py > temp/bg-qa-merge-dry-run-report.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat temp/bg-qa-merge-dry-run-report.txt
          exit 0

      - name: Commit QA reports
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp/bg-qa-validation-report.txt temp/bg-qa-merge-dry-run-report.txt
          if git diff --cached --quiet; then
            echo "QA reports unchanged."
          else
            git commit -m "Update Bulgarian QA validation reports"
            git push
          fi

      - name: Fail on QA errors
        if: steps.validate.outputs.exit_code != '0' || steps.merge.outputs.exit_code != '0'
        run: exit 1

# Reports are committed outside the watched paths, so report updates do not trigger loops.
