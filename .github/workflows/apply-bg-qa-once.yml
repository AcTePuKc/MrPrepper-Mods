name: Apply Bulgarian QA Once

on:
  push:
    branches:
      - translation/bg-qa-fixes
    paths:
      - 'temp/bg-qa-apply.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: translation/bg-qa-fixes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate deterministic consistency staging
        run: |
          python scripts/generate_bg_consistency_fixes.py
          python scripts/generate_bg_prepper_fixes.py

      - name: Validate staged QA before apply
        run: python scripts/validate_bg_qa.py

      - name: Require clean dry-run before apply
        run: python scripts/apply_bg_qa.py

      - name: Apply staged QA to labels.txt
        run: python scripts/apply_bg_qa.py --write

      - name: Validate the already-written labels.txt
        run: python scripts/apply_bg_qa.py > temp/bg-qa-post-apply-report.txt

      - name: Commit applied translation and post-apply report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MrPrepperTranslationMod/translations/labels.txt temp/bg-qa-post-apply-report.txt
          git commit -m "Apply Bulgarian localization QA fixes"
          git push
